<section id="hospital_contact" class="section" style="padding: 48px 0; ">
  <div class="container">
    <div class="contact-layout">
      <div class="contact-info" style="text-align: left; text-align: left;">
        <h3>Contact</h3>
        <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">
          <div class="contact-item" style="display: flex; align-items: center; gap: 12px;"><span class="material-icons">phone</span><span>+1 800 555 1000</span></div>
          <div class="contact-item" style="display: flex; align-items: center; gap: 12px;"><span class="material-icons">email</span><span>[info@medcarehospital.com](mailto:info@medcarehospital.com)</span></div>
          <div class="contact-item" style="display: flex; align-items: center; gap: 12px;"><span class="material-icons">location_on</span><span>123 Medical Avenue, New York, USA</span></div>
        </div>
      </div>
      <div class="card" style="margin: 0;">
        <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent!');">
          <input type="text" placeholder="Your Name" required />
          <input type="email" placeholder="Your Email" required />
          <textarea placeholder="Your Message" rows="5" required></textarea>
          <button class="btn btn-primary" type="submit">Submit Form</button>
        </form>
      </div>
    </div>
  </div>
</section>
